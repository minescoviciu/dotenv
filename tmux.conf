
# chante C-b to C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 2000

set -g focus-events on
# move as in vim
set -g mode-keys vi
set -g mouse on
set -g display-time 0

set -g set-clipboard on

# SSH Agent — pin SSH_AUTH_SOCK to a stable symlink path managed by bashrc.sh,
# and remove it from update-environment so client reattach does not overwrite
# the pinned value with the raw forwarded socket path (which goes stale after
# the originating ssh session ends).
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

bind | split-window -h
bind - split-window -v

bind < resize-pane -L 1
bind > resize-pane -R 1
# bind - resize-pane -D 1
# bind + resize-pane -U 1

#reload your tmux configuration without killing your session
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf!"

# Set session cwd to active pane path
bind-key C attach -c "#{pane_current_path}"

# clear screen and pane scrollback
bind C-b clear-history \; send-keys C-l

# enable color in tmux
set -g default-terminal "xterm-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Direct Shift+Enter binding for Claude Code (sends CSI u sequence)
bind-key -n S-Enter send-keys Escape '[13;2u'

set-option -g allow-passthrough on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g allow-passthrough all

# Copy but do not clear the selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-selection-no-clear
bind -T root         DoubleClick1Pane  select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-selection-no-clear }
bind -T copy-mode-vi Enter send-keys -X copy-pipe
bind -T copy-mode-vi p send-keys -X previous-prompt
bind -T copy-mode-vi P send-keys -X next-prompt

# default values
set -g word-separators "!\"#$%&'()*+,-./:;<=>?@[\\]^`{|}~"
# set -g word-separators "!\"#$%&'()*,:;<=>?@[\\]^`{|}~"

# List of plugins
set -g @plugin 'tmux-plugins/tpm' # tpm should be at the beginning
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'roosta/tmux-fuzzback'
# End of plugins

# Continuum & Resurrect config
set -g @continuum-restore 'on'

# fuzzback config
# set -g @fuzzback-bind s
# set -g @fuzzback-popup 1
# set -g @fuzzback-popup-size '90%'
# set -g @fuzzback-finder-bind "ctrl-f:become(~/.config/scripts/fuzzback-bindings.sh {})"

# Catppuccin config (v2.x API)
set -g @catppuccin_flavor 'mocha'

# Window styling (custom: restore original Powerline+block separators)
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Window separators carry Powerline-style color transitions:
#   block char (█) acts as the colored edge between segments.
# Inactive: text_color block <- text segment -> number_color block.
set -g @catppuccin_window_left_separator   "#[fg=#{@catppuccin_window_text_color},bg=default]█"
set -g @catppuccin_window_middle_separator " #[fg=#{@catppuccin_window_number_color},bg=#{@catppuccin_window_text_color}]█"
set -g @catppuccin_window_right_separator  "#[fg=#{@catppuccin_window_number_color},bg=default]█"

# Active: same shape, current-* colors (mauve number by default).
set -g @catppuccin_window_current_left_separator   "#[fg=#{@catppuccin_window_current_text_color},bg=default]█"
set -g @catppuccin_window_current_middle_separator " #[fg=#{@catppuccin_window_current_number_color},bg=#{@catppuccin_window_current_text_color}]█"
set -g @catppuccin_window_current_right_separator  "#[fg=#{@catppuccin_window_current_number_color},bg=default]█"

# Status bar separators
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_connect_separator "no"

# Per-module color overrides (must be set before catppuccin.tmux is loaded)
set -g @catppuccin_session_color "#{?client_prefix,#f2cdcd,#a6e3a1}"
set -g @catppuccin_date_time_color "#89b4fa"
set -g @catppuccin_host_color "#74c7ec"

# Load catppuccin (after options, before status-left/right)
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Status bar layout: left = session, right = host + date_time
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_host}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

run -b '~/.config/scripts/snippets.sh'
# Initialize tpm (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

bind-key "u" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/clipboard.sh"
bind-key "w" run-shell -b "TMUX_FZF_OPTIONS='-p -w 98% -h 90% -m --preview-window=right,68%,border-left' ~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

set-option -g status-position top
#set pane-border-status off
set pane-border-status top

bind-key A run-shell -b "~/.config/scripts/aws-sso.py --dispatch '#{client_tty}'"
bind-key k run-shell "~/.config/scripts/tmux-toggle-popup.sh "
bind-key o run-shell "~/.config/scripts/tmux-toggle-nvim-opencode.sh"
bind-key s run-shell  "~/.config/scripts/colors.py"
bind-key R split-window -v -c "#{pane_current_path}" "codex resume --last --fork"
# This lets us do scrollback and search within the popup
# bind-key -T popup [ copy-mode
